<!doctype html>
<html lang="ru">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="tornado-root" content="{{ request.script_root }}">
 <title>Tornado</title>
 <style>
 body > #chat-startup:not([hidden]){position:fixed;inset:0;z-index:50;background:#080808;color:#f2f7f4;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;font:15px system-ui,sans-serif}
 #chat-startup .startup-brand{display:flex;align-items:center;gap:12px;font:400 30px "Golos Text",system-ui,sans-serif}
 #chat-startup .startup-brand svg{width:64px;height:auto;filter:drop-shadow(0 0 10px #ddffeb38);animation:tornado-logo 460ms cubic-bezier(.16,1,.3,1) both}
 #chat-startup .startup-word{display:flex}
 #chat-startup .startup-word span{animation:tornado-letter 260ms cubic-bezier(.16,1,.3,1) both;animation-delay:calc(115ms + var(--letter) * 28ms)}
 #chat-startup.startup-leaving{pointer-events:none;animation:tornado-dismiss 230ms ease-out both}
 #chat-startup .startup-progress{height:2px;width:76px;overflow:hidden;border-radius:8px;background:#263630}
 #chat-startup .startup-progress::before{content:'';display:block;width:36px;height:100%;border-radius:8px;background:#91cbb0;animation:tornado-progress .9s ease-in-out infinite alternate}
 #chat-startup a{color:#a7d9bf}
 @keyframes tornado-logo{from{opacity:0;transform:translateX(44px) scale(.78)}to{opacity:1;transform:translateX(0) scale(1)}}
 @keyframes tornado-letter{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
 @keyframes tornado-dismiss{to{opacity:0}}
 @keyframes tornado-progress{to{transform:translateX(40px)}}
 @media(prefers-reduced-motion:reduce){ #chat-startup .startup-brand svg,#chat-startup .startup-word span,#chat-startup .startup-progress::before,#chat-startup.startup-leaving{animation:none}}
 </style>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
 <link rel="stylesheet" href="{{ url_for('static', filename='chat-web/tornado.css', v=asset_version) }}">
</head>
<body>
 <div id="root"></div>
 <div id="chat-startup" role="status">
  <div class="startup-brand"><svg viewBox="0 0 1132 642" aria-hidden="true"><path fill="currentColor" d="M442.493 592L687.802 384.673L687.802 235.834L811.937 235.834L1082 50L334.072 50L50 235.834L442.493 235.834L442.493 592Z"/></svg><span class="startup-word" aria-label="Tornado" role="img">{% for letter in 'Tornado' %}<span aria-hidden="true" style="--letter:{{ loop.index0 }}">{{ letter }}</span>{% endfor %}</span></div>
  <div class="startup-progress" aria-label="Загрузка"></div>
  <span class="startup-message" hidden></span>
  <small hidden class="startup-detail"></small>
  <a hidden href="{{ url_for('chat') }}">Обновить страницу</a>
  <noscript>Включите JavaScript, чтобы открыть чаты.</noscript>
 </div>
 <script type="application/json" id="tornado-session">{{ account | tojson }}</script>
 <script data-cfasync="false">
  const startup = document.getElementById('chat-startup');
  window.tornadoFirstChats = fetch({{ (request.script_root ~ '/api/chats?limit=50&offset=0') | tojson }},
    {cache:'no-store', signal:AbortSignal.timeout(7000)}).then(response => response.ok ? response.json() : null).catch(() => null);
  function showChatStartupError(detail) {
    startup.hidden = false;
    const message = startup.querySelector('.startup-message');
    message.textContent = 'Чат не загрузился.';
    message.hidden = false;
    startup.querySelector('.startup-progress').hidden = true;
    startup.querySelector('a').hidden = false;
    const output = startup.querySelector('.startup-detail');
    output.textContent = detail;
    output.hidden = false;
  }
  let clientLoaded = false;
  const parts = {{ chat_parts | tojson }};
  const slowStartup = setTimeout(() => showChatStartupError(clientLoaded
    ? 'Скрипт загружен, но React не отобразил интерфейс.'
    : 'Истекло время ожидания загрузки интерфейса.'), parts ? 20000 : 10000);
  const chatRoot = document.getElementById('root');
  function handleStartupError(event) {
    if (chatRoot.firstElementChild) return;
    clearTimeout(slowStartup);
    showChatStartupError(event.message || 'Ошибка выполнения JavaScript.');
  }
  window.addEventListener('error', handleStartupError);
  window.addEventListener('unhandledrejection', event => {
    if (chatRoot.firstElementChild) return;
    clearTimeout(slowStartup);
    const reason = event.reason;
    showChatStartupError(reason?.message || (typeof reason === 'string' ? reason : 'Необработанная ошибка при запуске.'));
  });
  chatRoot.addEventListener('tornado:render-error', handleStartupError);
  const startupObserver = new MutationObserver(() => {
    if (!chatRoot.firstElementChild) return;
    clearTimeout(slowStartup);
    startupObserver.disconnect();
  });
  startupObserver.observe(chatRoot, {childList: true});
  document.addEventListener('tornado:chat-ready', async () => {
    clearTimeout(slowStartup);
    const brand = startup.querySelector('.startup-brand');
    await Promise.allSettled(brand.getAnimations({subtree:true}).map(animation => animation.finished));
    startup.classList.add('startup-leaving');
    await Promise.allSettled(startup.getAnimations().map(animation => animation.finished));
    startup.hidden = true;
  }, {once:true});
  const client = document.createElement('script');
  client.setAttribute('data-cfasync', 'false');
  client.onerror = async () => {
    clearTimeout(slowStartup);
    showChatStartupError('Браузер не смог загрузить файл интерфейса.');
    if (parts) return;
    try {
      const response = await fetch(client.src, {method:'HEAD', cache:'no-store'});
      const type = response.headers.get('content-type') || 'не указан';
      if (!response.ok) showChatStartupError('tornado.js: HTTP ' + response.status + '.');
      else if (!/^(text|application)\/(javascript|ecmascript)\b/i.test(type))
        showChatStartupError('tornado.js: неверный Content-Type (' + type + ').');
      else showChatStartupError('tornado.js доступен (HTTP ' + response.status + '), но браузер отклонил загрузку скрипта.');
    } catch (error) {
      showChatStartupError('tornado.js: ' + (error.message || 'сетевая ошибка'));
    }
  };
  client.onload = () => {
    clientLoaded = true;
    clearTimeout(slowStartup);
    if (!chatRoot.firstElementChild && startup.querySelector('a').hidden) {
      setTimeout(() => {
        if (!chatRoot.firstElementChild && startup.querySelector('a').hidden)
          showChatStartupError('Файл интерфейса загрузился, но чат не запустился.');
      }, 2000);
    }
  };
  document.body.appendChild(client);
  if (!parts) {
    client.src = {{ url_for('static', filename='chat-web/tornado.js', v=asset_version) | tojson }};
  } else {
    async function loadParts() {
      const base = {{ url_for('static', filename='chat-parts/' ~ asset_version ~ '/') | tojson }};
      const blocks = new Array(parts.count);
      let next = 0;
      async function download() {
        while (next < blocks.length) {
          const index = next++;
          const name = String(index).padStart(2, '0');
          let result;
          for (let attempt = 0; attempt < 2; attempt++) {
            try {
              result = await fetch(base + name + '.js', {signal: AbortSignal.timeout(7000)});
              if (result.ok) {
                blocks[index] = await result.arrayBuffer();
                break;
              }
            } catch (error) {
              if (attempt === 1) throw new Error('Часть ' + (index + 1) + ': ' + error.message);
            }
          }
          if (!blocks[index]) throw new Error('Часть ' + (index + 1) + ': HTTP ' + result?.status);
        }
      }
      await Promise.all(Array.from({length:6}, download));
      const blob = new Blob(blocks, {type:'application/javascript'});
      const hash = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer());
      const hex = Array.from(new Uint8Array(hash), value => value.toString(16).padStart(2, '0')).join('');
      if (hex !== parts.sha256) throw new Error('Загруженные части интерфейса не прошли проверку целостности.');
      const url = URL.createObjectURL(blob);
      client.addEventListener('load', () => URL.revokeObjectURL(url), {once:true});
      client.addEventListener('error', () => URL.revokeObjectURL(url), {once:true});
      client.src = url;
    }
    loadParts().catch(error => {
      clearTimeout(slowStartup);
      showChatStartupError(error.message);
    });
  }
 </script>
</body>
</html>
