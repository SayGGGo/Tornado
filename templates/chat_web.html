<!doctype html>
<html lang="ru">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="tornado-root" content="{{ request.script_root }}">
 <title>Tornado</title>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
 <link rel="stylesheet" href="{{ url_for('static', filename='chat-web/tornado.css', v=asset_version) }}">
</head>
<body>
 <div id="root"></div>
 <div id="chat-startup" role="status">
  <span>Открываем чаты…</span>
  <small hidden class="startup-detail"></small>
  <a hidden href="{{ url_for('chat') }}">Обновить страницу</a>
  <noscript>Включите JavaScript, чтобы открыть чаты.</noscript>
 </div>
 <script type="application/json" id="tornado-session">{{ account | tojson }}</script>
 <script data-cfasync="false">
  const startup = document.getElementById('chat-startup');
  function showChatStartupError(detail) {
    startup.hidden = false;
    startup.querySelector('span').textContent = 'Чат не загрузился.';
    startup.querySelector('a').hidden = false;
    const output = startup.querySelector('.startup-detail');
    output.textContent = detail;
    output.hidden = false;
  }
  const slowStartup = setTimeout(() => showChatStartupError('Интерфейс не запустился за 7 секунд.'), 7000);
  const chatRoot = document.getElementById('root');
  function handleStartupError(event) {
    if (chatRoot.firstElementChild) return;
    clearTimeout(slowStartup);
    showChatStartupError(event.message || 'Ошибка выполнения JavaScript.');
  }
  window.addEventListener('error', handleStartupError);
  chatRoot.addEventListener('tornado:render-error', handleStartupError);
  const startupObserver = new MutationObserver(() => {
    if (!chatRoot.firstElementChild) return;
    clearTimeout(slowStartup);
    startup.hidden = true;
    startupObserver.disconnect();
  });
  startupObserver.observe(chatRoot, {childList: true});
  const client = document.createElement('script');
  client.setAttribute('data-cfasync', 'false');
  client.onerror = () => {
    clearTimeout(slowStartup);
    showChatStartupError('Браузер не смог загрузить файл интерфейса.');
  };
  client.onload = () => {
    clearTimeout(slowStartup);
    if (!chatRoot.firstElementChild && startup.querySelector('a').hidden) {
      setTimeout(() => {
        if (!chatRoot.firstElementChild && startup.querySelector('a').hidden)
          showChatStartupError('Файл интерфейса загрузился, но чат не запустился.');
      }, 2000);
    }
  };
  client.src = {{ url_for('static', filename='chat-web/tornado.js', v=asset_version) | tojson }};
  document.body.appendChild(client);
 </script>
</body>
</html>
